name: docker

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7 (v7.0.0)
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: go test ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4 (v4.4.0)
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4 (v4.4.1)
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4 (v4.6.0)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6 (v6.2.0)
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      # Build to a local OCI archive and scan it before anything is published.
      - name: Build image for scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7 (v7.4.0)
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha
      - name: Scan image (Grype, fail on high)
        env:
          # anchore/grype v0.120.1
          GRYPE_IMAGE: anchore/grype@sha256:e4a44ef45d285b829ce6efe2642980329661bd2d18eab5fc539138d4adaebbbe
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker run --rm --cap-drop ALL --security-opt no-new-privileges:true \
              -v "$RUNNER_TEMP/image.tar:/image.tar:ro" \
              "$GRYPE_IMAGE" oci-archive:/image.tar --platform "$platform" --fail-on high
          done
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7 (v7.4.0)
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
