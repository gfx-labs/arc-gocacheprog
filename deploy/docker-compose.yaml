# Local stack: postgres, seaweedfs (S3) and the cache server.
#   docker compose -f deploy/docker-compose.yaml up --build
# Server on http://localhost:8080, static key "dev-key" (see config.compose.yaml).
name: arcgocache

services:
  postgres:
    image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3 # 17.11, multi-arch index
    environment:
      POSTGRES_USER: arcgocache
      POSTGRES_PASSWORD: arcgocache
      POSTGRES_DB: arcgocache
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcgocache -d arcgocache"]
      interval: 2s
      timeout: 3s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d # github.com/seaweedfs/seaweedfs release 4.48
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    volumes:
      - seaweed:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "127.0.0.1:${SEAWEEDFS_S3_PORT:-8333}:8333"

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["-config", "/etc/arc-gocacheprog/config.yaml"]
    volumes:
      - ./config.compose.yaml:/etc/arc-gocacheprog/config.yaml:ro
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Upload spool (os.TempDir), RAM-backed. config.compose.yaml caps peak spool
    # at 8 uploads x 16 MiB = 128 MiB. Keep this size above that product if the
    # limits change. The built-in defaults (32 x 1 GiB) would not fit.
    tmpfs:
      - /tmp:size=1g,mode=1777,noexec,nosuid,nodev
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    restart: on-failure

volumes:
  pgdata:
  seaweed:
