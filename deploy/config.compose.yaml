# Config for deploy/docker-compose.yaml. Local use only: static key, fixed credentials.
listen: ":8080"
database_url: postgres://arcgocache:arcgocache@postgres:5432/arcgocache?sslmode=disable

s3:
  endpoint: http://seaweedfs:8333
  region: us-east-1
  bucket: gocache
  prefix: gocache/
  access_key_id: arcgocacheaccess
  secret_access_key: arcgocachesecret
  use_path_style: true
  create_bucket: true

storage:
  # Keep temporary uploads within the server container's 1 GiB /tmp limit.
  max_blob_bytes: 16777216
  max_concurrent_uploads: 8
  max_concurrent_uploads_per_namespace: 4
  request_timeout: 2m

auth:
  static:
    - name: compose
      # sha256 of "dev-key"
      key_sha256: 7e9f8fd111802be56c379d597842e29b2cebd35ff2133d431a49fa556a18704e
      namespace: local
      write_scope: master
      read_scopes: [master]
